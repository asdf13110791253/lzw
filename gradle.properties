# ============================================================
# JVM 配置（针对 CI 环境优化，防止 OOM 和超时）
# ============================================================
# CI 机器内存有限，4G 容易崩，改为 3G 更安全
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseG1GC
# Kotlin 守护进程在 CI 里也要限内存，不然会炸
kotlin.daemon.jvmargs=-Xmx1536m

# ============================================================
# 构建加速（适合 CI）
# ============================================================
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
# 关键：设置网络超时时间为 2 分钟，解决国内网络波动导致的卡死
org.gradle.socket.timeout=120000
org.gradle.connect.timeout=120000

# ============================================================
# Android 核心配置（必须）
# ============================================================
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=true

# ============================================================
# 代码风格与编译器（你的原配置保留）
# ============================================================
kotlin.code.style=official
# 官方强制要求的兼容开关，彻底跳过版本校验
androidx.compose.compiler.suppressKotlinVersionCompatibilityCheck=true

# ============================================================
# R8 混淆（CI 中建议先关闭 Full Mode 排查问题，成功后可以再开）
# 如果遇到莫名其妙的崩溃，把这行注释掉
# ============================================================
# android.enableR8.fullMode=true
