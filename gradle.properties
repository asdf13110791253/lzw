# Gradle JVM 参数
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# Compose
org.jetbrains.compose.experimental.jscan=true

# ✅✅✅ 关键修复：强制指定 Compose 编译器版本
# 这行优先级最高，直接告诉 AGP 用 1.5.14 而不是被降级的 1.3.2
androidx.compose.compiler.version=1.5.14

# 关闭增量编译以减小体积（release 时）
android.enableR8.fullMode=true
