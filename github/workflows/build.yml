name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # 自动下载缺失的gradle-wrapper.jar，解决你没有jar文件的问题
      - name: Download gradle wrapper jar
        run: |
          GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/')
          wget https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip
          unzip gradle-$GRADLE_VERSION-bin.zip gradle-$GRADLE_VERSION/lib/gradle-wrapper.jar
          cp gradle-$GRADLE_VERSION/lib/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar

      # 赋予脚本运行权限
      - name: Permission
        run: chmod +x gradlew

      # 编译Debug安装包
      - name: Build APK
        run: ./gradlew assembleDebug

      # 上传编译好的APK成品
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-APK
          path: app/build/outputs/apk/debug/*.apk
