- name: Download prebuilt so library v2.0
  run: |
    mkdir native_libs

    # 下载函数：带重试 + 文件类型校验 + 超时限制
    download_file() {
      local url="$1"
      local output="$2"
      local max_retries=5
      for ((i=1; i<=max_retries; i++)); do
        echo "📥 尝试下载 (第 $i 次): $url"
        rm -f "$output"
        # 增加30秒超时，防止无限卡死
        if wget --timeout=30 --no-check-certificate -O "$output" "$url"; then
          local filetype=$(file -b "$output" | head -1)
          local filesize=$(stat -c%s "$output")
          echo "📄 文件类型: $filetype, 大小: $filesize 字节"
          # 判断是否为合法zip压缩包
          if echo "$filetype" | grep -qi "Zip archive"; then
            echo "✅ 下载成功且文件有效: $output"
            return 0
          else
            echo "⚠️ 下载的不是有效 zip 文件（网页/错误页面），删除后重试"
            rm -f "$output"
          fi
        else
          echo "⚠️ 下载失败（网络/链接失效）"
        fi
        echo "⏳ 等待 5 秒后重试..."
        sleep 5
      done
      echo "🚨 多次重试后仍失败: $output"
      return 1
    }

    # 替换为你自己仓库真实有效的附件直链
    download_file "https://github.com/user-attachments/files/30623868/liblingmiao_engine.zip" "liblingmiao_engine.zip" || exit 1
    download_file "https://github.com/user-attachments/files/30623924/libopencv_java4.zip" "libopencv_java4.zip" || exit 1

    # 静默解压到临时目录native_libs
    echo "===== 解压 liblingmiao_engine.zip ====="
    unzip -qq -o liblingmiao_engine.zip -d native_libs
    echo "===== 解压 libopencv_java4.zip ====="
    unzip -qq -o libopencv_java4.zip -d native_libs

    # 打印完整目录结构，方便排错
    echo "===== native_libs 完整目录结构 ====="
    find native_libs -type f

    # 对应你项目固定so存放路径 app/src/main/jniLibs/arm64-v8a
    TARGET_JNI_DIR="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
    mkdir -p $TARGET_JNI_DIR

    # 优先复制arm64-v8a文件夹内so，无文件夹则全局搜索所有so复制
    if ls native_libs/arm64-v8a/*.so >/dev/null 2>&1; then
      cp native_libs/arm64-v8a/*.so $TARGET_JNI_DIR/
    else
      echo "⚠️ 未找到arm64-v8a子目录，全局检索所有so文件复制"
      find native_libs -name "*.so" -exec cp {} $TARGET_JNI_DIR/ \;
    fi

    # 输出最终目录文件
    echo "===== 最终 jniLibs 目录内容 ====="
    ls -lh $TARGET_JNI_DIR

    # 严格校验两个必需so文件，缺失直接终止流程
    cd $TARGET_JNI_DIR
    if [ ! -f "liblingmiao_engine.so" ]; then
      echo "❌ 致命错误：缺失 liblingmiao_engine.so"
      ls -la
      exit 1
    fi
    if [ ! -f "libopencv_java4.so" ]; then
      echo "❌ 致命错误：缺失 libopencv_java4.so"
      ls -la
      exit 1
    fi
    echo "✅ v2.0版本校验完成：两个so文件全部就绪，可正常编译打包"
