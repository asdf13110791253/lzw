name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # 生成兼容项目的Gradle 8.10 wrapper
      - name: 生成Gradle包装器
        run: |
          gradle wrapper --gradle-version 8.10
          chmod +x gradlew
      # 清理旧构建缓存，防止版本残留冲突
      - name: 清理缓存
        run: ./gradlew clean

      # 编译Debug安装包
      - name: 编译APK
        run: ./gradlew :app:assembleDebug --stacktrace --info

      # 上传打包成品
      - name: 导出APK文件
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao_APK
          path: app/build/outputs/apk/debug/
