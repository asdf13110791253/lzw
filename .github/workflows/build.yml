name: Build LingMiao V2.0 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ✅ 腾讯云镜像 + 官方源兜底
      - name: Install Android cmdline-tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          echo "📥 尝试从腾讯云镜像下载 cmdline-tools..."
          if wget -q --timeout=30 "https://mirrors.cloud.tencent.com/android/repository/commandlinetools-linux-15859902_latest.zip" -O /tmp/cmd.zip; then
            echo "✅ 腾讯云镜像下载成功"
          else
            echo "⚠️ 腾讯云镜像失败，尝试官方源..."
            wget -q --timeout=60 "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -O /tmp/cmd.zip
            echo "✅ 官方源下载成功"
          fi
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK & NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ 4 重兜底下载 gradle-wrapper.jar
      - name: Ensure gradle-wrapper.jar exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar 丢失，尝试下载..."
            if wget -q --timeout=30 "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -O gradle/wrapper/gradle-wrapper.jar 2>/dev/null; then
              echo "✅ 从 GitHub raw 下载成功"
            elif wget -q --timeout=30 "https://ghfast.top/https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -O gradle/wrapper/gradle-wrapper.jar 2>/dev/null; then
              echo "✅ 从 ghfast.top 镜像下载成功"
            elif curl -sL --retry 3 --connect-timeout 30 -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"; then
              echo "✅ 从 curl 下载成功"
            else
              echo "❌ 尝试本地生成..."
              wget -q --timeout=60 "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -O /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /tmp/
              /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5 --distribution-type bin 2>/dev/null || true
            fi
            # 验证文件
            if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && [ -s "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "✅ 验证通过 ($(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes)"
            else
              echo "❌ 文件无效"
              exit 1
            fi
          else
            echo "✅ gradle-wrapper.jar 已存在"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiaoV2-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
