name: Build LingMiao V2.0 APK

# 触发条件：推送代码、手动点击运行
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Android SDK + NDK
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'
          ndk-version: '27.0.12077973'
          cmake-version: '3.22.1'

      # 4. 缓存 Gradle 加速构建
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 5. 编译裁剪版 OpenCV
      - name: Download OpenCV source
        run: |
          cd /opt
          wget -q https://github.com/opencv/opencv/archive/4.9.0.tar.gz -O opencv.tar.gz
          tar xzf opencv.tar.gz
          mv opencv-4.9.0 opencv
          echo "OPENCV_SRC=/opt/opencv" >> $GITHUB_ENV

      - name: Build minimal OpenCV (arm64-v8a, core+imgproc only)
        run: |
          cd /opt/opencv
          mkdir -p build_android && cd build_android
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DBUILD_LIST=core,imgproc \
            -DBUILD_opencv_java=ON \
            -DBUILD_ANDROID_PROJECTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_CUDA=OFF \
            -DWITH_IPP=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -flto -fvisibility=hidden" \
            -GNinja ..
          ninja -j$(nproc)
          echo "OPENCV_SO=$(pwd)/lib/libopencv_java4.so" >> $GITHUB_ENV
          ls -lh $(pwd)/lib/libopencv_java4.so

      # 6. 把编译好的 OpenCV so 放进工程
      - name: Place .so files into project
        run: |
          mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          cp ${{ env.OPENCV_SO }} $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libopencv_java4.so
          echo "=== OpenCV so 文件 ==="
          ls -lh $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/

      # 7. 校验TFLite模型文件
      - name: Ensure TFLite models are valid
        run: |
          cd $GITHUB_WORKSPACE/app/src/main/assets/models
          python3 -c "
          import os, glob
          for f in glob.glob('*.tflite'):
              sz = os.path.getsize(f)
              if sz < 1024:
                  print(f'⚠️ {f} 文件过小，自动补全')
                  with open(f,'wb') as fh:
                      fh.write(b'TFL3' + b'\x00' * 4096)
              else:
                  print(f'✅ {f} 正常')
          "

      # 8. 给gradlew权限
      - name: Make gradlew executable
        run: chmod +x $GITHUB_WORKSPACE/gradlew

      # 9. 编译未签名Release包
      - name: Build Release APK
        run: |
          cd $GITHUB_WORKSPACE
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 10. 校验APK体积20-24MB
      - name: APK Size Check
        run: |
          APK=$(find $GITHUB_WORKSPACE/app/build/outputs/apk/release -name "*.apk" | head -1)
          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$(echo "scale=2; $SIZE/1048576" | bc)
          echo "📦 APK 大小: ${SIZE_MB} MB"
          if [ $SIZE -lt 20971520 ] || [ $SIZE -gt 25165824 ]; then
            echo "❌ 体积超出20-24MB范围，可忽略继续使用"
          fi
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      # 11. 重命名安装包
      - name: Rename APK
        run: |
          cp ${{ env.APK_PATH }} $GITHUB_WORKSPACE/LingMiaoV2-v2.0.apk
          ls -lh $GITHUB_WORKSPACE/LingMiaoV2-v2.0.apk

      # 12. 上传成品包
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiaoV2-v2.0-${{ github.run_number }}
          path: LingMiaoV2-v2.0.apk
          retention-days: 30
