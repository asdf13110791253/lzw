name: Build LingMiao V2.0 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
  # ✅ 让 Gradle 走国内加速镜像（解决 Maven 下载慢）
  GRADLE_MIRROR: "https://maven.aliyun.com/repository/public"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ✅ ubuntu-latest 自带 Android SDK + NDK，直接用
      - name: Verify Android SDK & NDK
        run: |
          echo "📍 ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "NDK not found in default path"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/ndk/25.2.9519653:$PATH" >> $GITHUB_ENV

      # ✅ 安装 NDK r25c（走 Google 官方源，ubuntu 镜像已配好）
      - name: Install NDK r25c + CMake 3.22.1
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "✅ NDK + CMake 安装完成"

      # ✅ OpenCV 改用轻量下载（只下 arm64-v8a 的 so + 头文件）
      - name: Download OpenCV (lightweight)
        run: |
          echo "📥 下载 OpenCV 4.9.0 精简包..."
          # 用 GitHub 的 archive 下载（比 Releases 稳定）
          wget -q --timeout=180 \
            "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip" \
            -O /tmp/opencv.zip || \
          wget -q --timeout=180 \
            "https://objects.githubusercontent.com/github-production-release-asset-2e5.../opencv-4.9.0-android-sdk.zip" \
            -O /tmp/opencv.zip

          unzip -q /tmp/opencv.zip -d /tmp/opencv-sdk
          OPENCV_PATH=$(find /tmp/opencv-sdk -maxdepth 1 -name "OpenCV-android-sdk" -type d | head -1)
          echo "OPENCV_SDK_PATH=$OPENCV_PATH" >> $GITHUB_ENV
          echo "✅ OpenCV SDK 路径: $OPENCV_PATH"

      # ✅ 配置 Gradle 走阿里云镜像（加速 Maven 依赖下载）
      - name: Configure Gradle Mirror
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/init.gradle" <<'EOF'
          allprojects {
              repositories {
                  maven { url "https://maven.aliyun.com/repository/public" }
                  maven { url "https://maven.aliyun.com/repository/google" }
                  mavenCentral()
                  google()
              }
          }
          EOF
          echo "✅ Gradle 镜像配置完成"

      # ✅ 生成 Gradle Wrapper
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew
          echo "✅ Gradle Wrapper 生成完成"

      # ✅ 构建 Release APK
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      # ✅ 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-V2.0-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
