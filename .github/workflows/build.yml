name: Build LingMiao V2.0 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
  ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: "**/*.gradle*"

      - name: Remove conflicting NDK 26
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26*

      - name: Install NDK r25c + CMake 3.22.1
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "✅ NDK 25.2.9519653 安装完成"

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew
          echo "✅ Gradle 8.7 Wrapper 生成完成"

      - name: Build Release APK
        run: |
          ./gradlew clean assembleRelease --no-daemon --no-build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-V2.0-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
