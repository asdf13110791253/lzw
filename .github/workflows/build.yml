name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 下载可用OpenCV 4.9 Android SDK
        run: |
          wget -O opencv-sdk.zip https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
          unzip -q opencv-sdk.zip
          cp -r OpenCV-android-sdk/sdk/java ./opencv
          mkdir -p ./opencv/src/main/jniLibs
          cp -r OpenCV-android-sdk/sdk/native/libs/arm64-v8a ./opencv/src/main/jniLibs/

      - name: 赋予编译脚本权限
        run: chmod +x gradlew

      - name: 编译Debug安装包
        run: ./gradlew assembleDebug

      - name: 导出APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao_APK安装包
          path: app/build/outputs/apk/debug/app-debug.apk
