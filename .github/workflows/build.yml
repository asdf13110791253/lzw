name: Build LingMiao V2.0 APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. 安装 Android cmdline-tools (使用最新版 14742923)
      - name: Install Android cmdline-tools
        run: |
          # 强制清理旧文件
          rm -rf $ANDROID_HOME/cmdline-tools
          
          # 重新创建目录
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          
          # 记录环境变量
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          
          # 下载最新版 cmdline-tools (版本号已从11076708更新到14742923)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip -O /tmp/cmd.zip
          
          # 解压
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          
          # 移动到正确位置
          mv /tmp/cmd/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          
          # 把命令路径加入系统搜索范围
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # 4. 安装 SDK & NDK
      - name: Install SDK & NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # 5. 直接用系统 Gradle 编译 (绕过 wrapper)
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      # 6. 上传成品
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiaoV2-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
