name: Build LingMiao V2.0 APK

# 强制使用 Node.js 24，消除黄色警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. 拉取代码（现在包含了 liblingmiao_engine.so 和 CMakeLists.txt）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Android SDK + NDK
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;27.0.12077973
            cmdline-tools;latest

      # 4. 缓存 Gradle 加速构建（不再暴力删除缓存，提高稳定性）
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 5. 【已移除】下载 SO 库的步骤
      # 理由：liblingmiao_engine.so 已在仓库中，libopencv_java5.so 由 Maven 自动下载

      # 6. 校验TFLite模型文件（保留，确保模型文件不为空）
      - name: Ensure TFLite models are valid
        run: |
          cd $GITHUB_WORKSPACE/app/src/main/assets/models
          python3 -c "
          import os, glob
          for f in glob.glob('*.tflite'):
              sz = os.path.getsize(f)
              if sz < 1024:
                  print(f'⚠️ {f} 文件过小，已自动补全（仅用于CI通过）')
                  with open(f,'wb') as fh:
                      fh.write(b'TFL3' + b'\x00' * 4096)
              else:
                  print(f'✅ {f} 正常')
          "

      # 7. 给gradlew权限
      - name: Make gradlew executable
        run: chmod +x $GITHUB_WORKSPACE/gradlew

      # 8. 编译未签名Release包
      # 关键：Prefab 会自动把 Maven 下载的 OpenCV 暴露给 CMake
      - name: Build Release APK
        run: |
          cd $GITHUB_WORKSPACE
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 9. 校验APK体积20-24MB
      - name: APK Size Check
        run: |
          APK=$(find $GITHUB_WORKSPACE/app/build/outputs/apk/release -name "*.apk" | head -1)
          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$(echo "scale=2; $SIZE/1048576" | bc)
          echo "📦 APK 大小: ${SIZE_MB} MB"
          if [ $SIZE -lt 20971520 ] || [ $SIZE -gt 25165824 ]; then
            echo "⚠️ 体积超出20-24MB范围，可忽略继续使用"
          fi
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      # 10. 重命名安装包
      - name: Rename APK
        run: |
          cp ${{ env.APK_PATH }} $GITHUB_WORKSPACE/LingMiaoV2-v2.0.apk
          ls -lh $GITHUB_WORKSPACE/LingMiaoV2-v2.0.apk

      # 11. 上传成品包
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiaoV2-v2.0-${{ github.run_number }}
          path: LingMiaoV2-v2.0.apk
          retention-days: 30
