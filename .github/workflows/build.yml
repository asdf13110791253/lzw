name: Build LingMiao V2.0 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # ✅ 强制使用 Node.js 24，消除 "Node.js 20 is deprecated" 警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # ✅ 全局 Gradle JVM 参数
  GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1️⃣ 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ 设置 JDK 17（Temurin）
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3️⃣ 安装 Android cmdline-tools
      - name: Install Android cmdline-tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip -O /tmp/cmd.zip
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # 4️⃣ 接受 licenses & 安装 SDK/NDK
      - name: Install SDK & NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      # 5️⃣ Gradle 缓存（加速后续构建）
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6️⃣ 赋予 gradlew 执行权限（Linux 必需）
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 7️⃣ 构建 Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 8️⃣ 上传 APK 产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiaoV2-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
