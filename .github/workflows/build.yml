name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 换阿里云SDK镜像，解决SDK下载超时
      - name: Switch SDK to Aliyun Mirror
        run: |
          mkdir -p ~/.android
          cat > ~/.android/repositories.cfg << EOF
          count=0
          EOF
          cat > $ANDROID_SDK_ROOT/tools/package.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <packages>
            <remote url="https://mirrors.aliyun.com/android/repository/" />
          </packages>
          EOF

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.1.10909125" "build-tools;30.0.3" "platforms;android-33"

      # 强制清缓存，避免旧配置干扰
      - name: Clean Gradle Cache
        run: rm -rf ~/.gradle/caches/ ~/.gradle/wrapper/

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 只编Debug包，减少出错概率
      - name: Build Debug APK
        run: ./gradlew assembleDebug --daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAssist-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
