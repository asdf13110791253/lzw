name: Build LingMiao V2.0 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ✅ ubuntu-latest 已预装 Android SDK（ANDROID_HOME 已设置）
      # 只需要用 sdkmanager 补装缺少的 NDK 和 CMake
      - name: Install NDK r25c + CMake 3.22.1 (Tencent Mirror)
        run: |
          echo "📍 ANDROID_HOME=$ANDROID_HOME"

          # 配置腾讯云镜像（加速大文件下载）
          mkdir -p "$HOME/.android"
          cat > "$HOME/.android/repositories.cfg" <<'EOF'
          https://mirrors.cloud.tencent.com/android/addon2.xml
          https://mirrors.cloud.tencent.com/android/repository2-1.xml
          https://mirrors.cloud.tencent.com/android/sys-img2-1.xml
          https://mirrors.cloud.tencent.com/android/extra.xml
          EOF

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "📦 安装 NDK r25c + CMake 3.22.1 ..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

          # 写入环境变量
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/ndk/25.2.9519653:$PATH" >> $GITHUB_ENV

          echo "✅ NDK + CMake 安装完成"

      # ✅ 下载 OpenCV 4.9.0 Android SDK
      - name: Download OpenCV Android SDK
        run: |
          echo "📥 下载 OpenCV 4.9.0 Android SDK..."
          wget -q --timeout=120 \
            "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip" \
            -O /tmp/opencv-sdk.zip

          unzip -q /tmp/opencv-sdk.zip -d /tmp/opencv-sdk
          OPENCV_PATH=$(find /tmp/opencv-sdk -maxdepth 1 -name "OpenCV-android-sdk" -type d | head -1)
          echo "OPENCV_SDK_PATH=$OPENCV_PATH" >> $GITHUB_ENV
          echo "✅ OpenCV SDK 路径: $OPENCV_PATH"

      # ✅ 生成 Gradle Wrapper（防止仓库缺少 wrapper jar）
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew
          echo "✅ Gradle Wrapper 生成完成"

      # ✅ 构建 Release APK
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      # ✅ 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-V2.0-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
