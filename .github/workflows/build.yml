name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库源码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # 安装系统Gradle 8.4，不用项目里破损的wrapper
      - name: 安装系统Gradle 8.4
        run: |
          sudo apt update
          sudo apt install gradle -y
          gradle wrapper --gradle-version 8.4

      - name: 授予脚本权限
        run: chmod +x gradlew

      - name: 下载OpenCV 4.9 SDK
        run: |
          wget -O opencv-sdk.zip https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
          unzip -q opencv-sdk.zip
          cp -r OpenCV-android-sdk/sdk/java ./opencv
          mkdir -p ./opencv/src/main/jniLibs
          cp -r OpenCV-android-sdk/sdk/native/libs/arm64-v8a ./opencv/src/main/jniLibs/

      - name: 查看项目模块任务
        run: ./gradlew tasks

      - name: 编译APP Debug安装包
        run: ./gradlew :app:assembleDebug

      - name: 导出成品APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao_成品APK
          path: app/build/outputs/apk/debug/app-debug.apk
