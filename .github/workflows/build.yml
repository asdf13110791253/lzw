name: Build LingMiao V2.0 APK

# ✅ 消除 Node.js 20 黄色警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. 【核心】用 Gradle 官方 action（自动处理 NDK 下载+缓存）
      - name: Setup Gradle & NDK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # 4. 安装 bc（APK 体积计算用）
      - name: Install bc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc

      # 5. 确认 Android SDK 就绪（ubuntu-latest 自带）
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "✅ Android SDK 基础包就绪"

      # 6. 校验 Native 库
      - name: Verify native libraries
        run: |
          echo "===== 检查 jniLibs 目录 ====="
          ls -lh "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/" || echo "⚠️ 目录不存在"
          cd "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          if [ ! -f "liblingmiao_engine.so" ]; then
            echo "❌ 缺失 liblingmiao_engine.so"
            exit 1
          fi
          echo "✅ liblingmiao_engine.so 存在"

      # 7. 校验 TFLite 模型
      - name: Ensure TFLite models are valid
        run: |
          MODELS_DIR="$GITHUB_WORKSPACE/app/src/main/assets/models"
          if [ -d "$MODELS_DIR" ]; then
            cd "$MODELS_DIR"
            python3 -c "
            import os, glob
            for f in glob.glob('*.tflite'):
                sz = os.path.getsize(f)
                if sz < 1024:
                    print(f'⚠️ {f} 过小，已自动补全')
                    with open(f,'wb') as fh:
                        fh.write(b'TFL3' + b'\x00' * 4096)
                else:
                    print(f'✅ {f} 正常')
            "
          fi

      # 8. gradlew 权限
      - name: Make gradlew executable
        run: chmod +x "$GITHUB_WORKSPACE/gradlew"

      # 9. 编译 Release APK
      - name: Build Release APK
        run: |
          cd "$GITHUB_WORKSPACE"
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 10. APK 体积校验
      - name: APK Size Check
        run: |
          APK=$(find "$GITHUB_WORKSPACE/app/build/outputs/apk/release" -name "*.apk" | head -1)
          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$(echo "scale=2; $SIZE/1048576" | bc)
          echo "📦 APK 大小: ${SIZE_MB} MB"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 11. 重命名
      - name: Rename APK
        run: |
          cp "${{ env.APK_PATH }}" "$GITHUB_WORKSPACE/LingMiaoV2-v2.0.apk"
          ls -lh "$GITHUB_WORKSPACE/LingMiaoV2-v2.0.apk"

      # 12. 上传
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiaoV2-v2.0-${{ github.run_number }}
          path: LingMiaoV2-v2.0.apk
          retention-days: 30
          timeout-minutes: 15
