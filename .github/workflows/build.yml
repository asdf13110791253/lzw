name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ============================================================
      # 关键修复：强制使用阿里云镜像（解决官方源超时/404）
      # ============================================================
      - name: Set up Android SDK Mirror
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          # 设置环境变量，强制 sdkmanager 走阿里云
          echo "SDKMANAGER_FORCE_HTTP=true" >> $GITHUB_ENV
          echo "https_proxy=http://mirrors.aliyun.com:80" >> $GITHUB_ENV
          echo "http_proxy=http://mirrors.aliyun.com:80" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.1.10909125" "build-tools;30.0.3" "platforms;android-33"

      # ============================================================
      # 清理环境 & 准备构建
      # ============================================================
      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf gradle/wrapper/dists/

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ============================================================
      # 开始构建
      # ============================================================
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAssist-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
