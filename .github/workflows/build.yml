name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: 下载配置OpenCV4.8
        run: |
          wget -O opencv-sdk.zip https://github.com/opencv/releases/download/4.8.0/opencv-4.8.0-android-sdk.zip
          unzip -q opencv-sdk.zip
          mkdir -p opencv/src/main/java
          mkdir -p opencv/src/main/jniLibs/arm64-v8a
          cp -r OpenCV-android-sdk/sdk/java/* ./opencv/src/main/java/
          cp -r OpenCV-android-sdk/sdk/native/libs/arm64-v8a/* ./opencv/src/main/jniLibs/arm64-v8a/

      - name: Gradle打包Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传编译好的APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-未签名安装包
          path: app/build/outputs/apk/debug/app-debug.apk
