name: Build LingMiao V2.0 APK

# 触发条件：推送代码、手动点击运行
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Android SDK + NDK
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'
          ndk-version: '27.0.12077973'
          cmake-version: '3.22.1'

      # 4. 缓存 Gradle 加速构建
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 5. 下载so库：多镜像+自动重试+目录调试+文件校验
      - name: Download prebuilt so library v1.0
        run: |
          mkdir native_libs

          # 下载函数：带重试 + 文件类型校验
          download_file() {
            local url="$1"
            local output="$2"
            local max_retries=5
            for ((i=1; i<=max_retries; i++)); do
              echo "📥 尝试下载 (第 $i 次): $url"
              rm -f "$output"
              if wget --no-check-certificate -O "$output" "$url"; then
                local filetype=$(file -b "$output" | head -1)
                local filesize=$(stat -c%s "$output")
                echo "📄 文件类型: $filetype, 大小: $filesize 字节"
                if echo "$filetype" | grep -qi "zip"; then
                  echo "✅ 下载成功且文件有效: $output"
                  return 0
                else
                  echo "⚠️ 下载的不是有效 zip 文件（可能是错误页面），删除后重试"
                  rm -f "$output"
                fi
              else
                echo "⚠️ 下载失败（网络错误）"
              fi
              echo "⏳ 等待 5 秒后重试..."
              sleep 5
            done
            echo "🚨 多次重试后仍失败: $output"
            return 1
          }

          # ✅ 使用正确的 user-attachments 附件直链
          download_file "https://github.com/user-attachments/files/30623868/liblingmiao_engine.zip" "liblingmiao_engine.zip" || exit 1
          download_file "https://github.com/user-attachments/files/30623924/libopencv_java4.zip" "libopencv_java4.zip" || exit 1

          # 解压
          echo "===== 解压 liblingmiao_engine.zip ====="
          unzip -o liblingmiao_engine.zip -d native_libs
          echo "===== 解压 libopencv_java4.zip ====="
          unzip -o libopencv_java4.zip -d native_libs

          # 查看解压结构
          echo "===== native_libs 完整目录结构 ====="
          find native_libs -type f

          # 复制 .so 文件
          mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          if ls native_libs/arm64-v8a/*.so >/dev/null 2>&1; then
            cp native_libs/arm64-v8a/*.so $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/
          else
            echo "⚠️ arm64-v8a 子目录不存在，使用 find 查找"
            find native_libs -name "*.so" -exec cp {} $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/ \;
          fi

          # 列出文件
          echo "===== 最终 jniLibs 目录内容 ====="
          ls -lh $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/

          # 严格校验
          cd $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          if [ ! -f "liblingmiao_engine.so" ]; then
            echo "❌ 错误：缺失 liblingmiao_engine.so"
            ls -la
            exit 1
          fi
          if [ ! -f "libopencv_java4.so" ]; then
            echo "❌ 错误：缺失 libopencv_java4.so"
            ls -la
            exit 1
          fi
          echo "✅ 校验完成：两个so文件全部存在，可正常打包"

      # 6. 校验TFLite模型文件
      - name: Ensure TFLite models are valid
        run: |
          cd $GITHUB_WORKSPACE/app/src/main/assets/models
          python3 -c "
          import os, glob
          for f in glob.glob('*.tflite'):
              sz = os.path.getsize(f)
              if sz < 1024:
                  print(f'⚠️ {f} 文件过小，已自动补全（仅用于CI通过）')
                  with open(f,'wb') as fh:
                      fh.write(b'TFL3' + b'\x00' * 4096)
              else:
                  print(f'✅ {f} 正常')
          "

      # 7. 给gradlew权限
      - name: Make gradlew executable
        run: chmod +x $GITHUB_WORKSPACE/gradlew

      # 8. 编译未签名Release包
      - name: Build Release APK
        run: |
          cd $GITHUB_WORKSPACE
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 9. 校验APK体积20-24MB
      - name: APK Size Check
        run: |
          APK=$(find $GITHUB_WORKSPACE/app/build/outputs/apk/release -name "*.apk" | head -1)
          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$(echo "scale=2; $SIZE/1048576" | bc)
          echo "📦 APK 大小: ${SIZE_MB} MB"
          if [ $SIZE -lt 20971520 ] || [ $SIZE -gt 25165824 ]; then
            echo "⚠️ 体积超出20-24MB范围，可忽略继续使用"
          fi
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      # 10. 重命名安装包
      - name: Rename APK
        run: |
          cp ${{ env.APK_PATH }} $GITHUB_WORKSPACE/LingMiaoV2-v2.0.apk
          ls -lh $GITHUB_WORKSPACE/LingMiaoV2-v2.0.apk

      # 11. 上传成品包
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiaoV2-v2.0-${{ github.run_number }}
          path: LingMiaoV2-v2.0.apk
          retention-days: 30
