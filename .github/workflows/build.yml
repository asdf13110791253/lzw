- name: Download prebuilt so library v1.0
  run: |
    mkdir native_libs

    # 下载函数：带重试 + 文件类型校验
    download_file() {
      local url="$1"
      local output="$2"
      local max_retries=5
      for ((i=1; i<=max_retries; i++)); do
        echo "📥 尝试下载 (第 $i 次): $url"
        rm -f "$output"
        if wget --no-check-certificate -O "$output" "$url"; then
          local filetype=$(file -b "$output" | head -1)
          local filesize=$(stat -c%s "$output")
          echo "📄 文件类型: $filetype, 大小: $filesize 字节"
          if echo "$filetype" | grep -qi "zip"; then
            echo "✅ 下载成功且文件有效: $output"
            return 0
          else
            echo "⚠️ 下载的不是有效 zip 文件（可能是错误页面），删除后重试"
            rm -f "$output"
          fi
        else
          echo "⚠️ 下载失败（网络错误）"
        fi
        echo "⏳ 等待 5 秒后重试..."
        sleep 5
      done
      echo "🚨 多次重试后仍失败: $output"
      return 1
    }

    # ✅ 使用正确的 user-attachments 附件直链
    download_file "https://github.com/user-attachments/files/30623868/liblingmiao_engine.zip" "liblingmiao_engine.zip" || exit 1
    download_file "https://github.com/user-attachments/files/30623924/libopencv_java4.zip" "libopencv_java4.zip" || exit 1

    # 解压
    echo "===== 解压 liblingmiao_engine.zip ====="
    unzip -o liblingmiao_engine.zip -d native_libs
    echo "===== 解压 libopencv_java4.zip ====="
    unzip -o libopencv_java4.zip -d native_libs

    # 查看解压结构
    echo "===== native_libs 完整目录结构 ====="
    find native_libs -type f

    # 复制 .so 文件
    mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
    if ls native_libs/arm64-v8a/*.so >/dev/null 2>&1; then
      cp native_libs/arm64-v8a/*.so $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/
    else
      echo "⚠️ arm64-v8a 子目录不存在，使用 find 查找"
      find native_libs -name "*.so" -exec cp {} $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/ \;
    fi

    # 列出文件
    echo "===== 最终 jniLibs 目录内容 ====="
    ls -lh $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/

    # 严格校验
    cd $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
    if [ ! -f "liblingmiao_engine.so" ]; then
      echo "❌ 错误：缺失 liblingmiao_engine.so"
      ls -la
      exit 1
    fi
    if [ ! -f "libopencv_java4.so" ]; then
      echo "❌ 错误：缺失 libopencv_java4.so"
      ls -la
      exit 1
    fi
    echo "✅ 校验完成：两个so文件全部存在，可正常打包"
